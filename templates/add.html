{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}
<header>
    <h1>Add Employee</h1>
    <a href="/" class="btn btn-ghost">← Back to list</a>
</header>

<div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/add">
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Priya Sharma">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Engineering">
            </div>
            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number" step="any" id="salary" name="salary" placeholder="e.g. 50000">
            </div>
            <div class="form-group">
                <label for="joining_date">Joining date</label>
                <input type="date" id="joining_date" name="joining_date">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Save Employee</button>
        </div>
    </form>
</div>
{% endblock %}
