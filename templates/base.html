<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Management{% endblock %}</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 24px;
        }
        h1 { margin: 0; font-size: 1.9rem; color: var(--text); }

        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 18px 22px; display: flex; flex-direction: column;
        }
        .stat-label { color: var(--muted); font-size: 0.85rem; }
        .stat-number { font-size: 1.8rem; font-weight: 700; color: var(--primary); }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 24px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; }
        .banner {
            background: #dcfce7; border: 1px solid #86efac; color: #15803d;
            padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 18px; border: 1px solid transparent; border-radius: 10px;
            font-family: inherit; font-size: 0.95rem; line-height: 1.2;
            color: white; background: var(--primary);
            text-decoration: none; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-ghost { background: #ffffff; border: 1px solid #a5b4fc; color: var(--primary-hover); }
        .btn-ghost:hover { background: #eef2ff; color: #3730a3; }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px; color: var(--muted);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: #f8fafc; }
        .avatar {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; margin-right: 10px; border-radius: 50%;
            background: #e0e7ff; color: var(--primary-hover);
            font-weight: 600; vertical-align: middle;
        }
        .actions { display: flex; gap: 8px; align-items: center; }
        .badge {
            padding: 4px 10px; border-radius: 999px; font-size: 0.85rem;
            background: #eef2ff; color: var(--primary-hover);
        }
        .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
        .error {
            background: #fef2f2; border: 1px solid #fca5a5;
            color: #b91c1c; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem; }
        input {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: #ffffff;
            color: var(--text); font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        .form-actions { margin-top: 28px; display: flex; gap: 12px; }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
