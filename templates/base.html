<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Management{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 30px;
        }
        h1 {
            margin: 0; font-size: 2rem;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .btn {
            display: inline-block; padding: 10px 18px; border: none; border-radius: 10px;
            font-size: 0.95rem; color: white; background: var(--accent);
            text-decoration: none; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-ghost:hover { background: var(--border); color: var(--text); }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px; color: var(--muted);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(99, 102, 241, 0.08); }
        .avatar {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; margin-right: 10px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #c084fc);
            font-weight: 600; vertical-align: middle;
        }
        .actions { display: flex; gap: 8px; align-items: center; }
        .badge {
            padding: 4px 10px; border-radius: 999px; font-size: 0.85rem;
            background: rgba(99, 102, 241, 0.2); color: #a5b4fc;
        }
        .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
        .error {
            background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);
            color: #fca5a5; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem;
        }
        input {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); }
        .form-actions { margin-top: 28px; display: flex; gap: 12px; }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
